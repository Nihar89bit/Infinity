services:
  - type: web
    name: our-little-world
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_PIN
        sync: false
      - key: DEFAULT_PASSWORD
        sync: false